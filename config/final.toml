# Final submission config: the joint model selected on IDSSE validation, loaded from the committed
# checkpoint so the submission regenerates without retraining. Identical to
# config/exp_supervised_joint.toml except model_path; rebuild steps are in models/README.md.
#     python -m mtah.predict --config config/final.toml        # -> outputs/Goalorithm.csv
team_name = "Goalorithm"
[dead_ball]
method = "supervised"
[possession]
method = "supervised"
[supervised]
model_path = "models/supervised_joint/model.json"
[supervised.features]
max_gap = 25
max_ball_speed_mps = 45.0
distance_cap_m = 30.0
gap_cap_frames = 250
windows = [5, 15, 25, 75]
slow_player_mps = 1.0
moving_ball_mps = 3.0
player_speed_scale_mps = 12.0
motion_lag_frames = 5
interactions = true
contact_radii_m = [0.75, 1.5, 2.5]
interaction_offsets = [-25, -10, -3, 3, 10, 25]
[supervised.training]
train_games = ["J03WOH", "J03WOY", "J03WPY"]
validation_games = ["J03WQQ", "J03WR9"]
test_games = ["J03WMX", "J03WN1"]
test_set_previous_exposure = "reused_after_v1_v2_v3; not an untouched holdout"
seed = 20261111
stride = 5
dropout_fraction = 0.4
dropout_mean_frames = 25
coordinate_noise_std_m = 0.15
decoder_scales = [0.03, 0.1, 0.3, 1.0]
[supervised.joint_selection]
body_configs = ["config/exp_supervised_v3.toml", "config/exp_supervised_balanced.toml"]
events_config = "config/exp_supervised_boundary.toml"
potential_weights = [0.0, 0.5, 1.0]
